<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HeavenlyBound // Lemuria Pause Menu & Companion HUD</title>
    <meta name="description" content="Pure Rust WebGPU / WebGL2 Pause Menu, Coral Escrow, Siren Radio, and Planetary Geodesics">
    <link rel="manifest" href="manifest.webmanifest">
    <link data-trunk rel="copy-file" href="manifest.webmanifest">
    <link data-trunk rel="copy-file" href="sonar-client.js">
    <link data-trunk rel="copy-file" href="sonar-config.json">
    <link data-trunk rel="copy-file" href="station-radio.js">
    <link data-trunk rel="copy-dir" href="app-icons">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0f19;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            width: 100%;
            height: 100%;
            outline: none;
        }

        #platform-menu {
            position: fixed;
            z-index: 10;
            bottom: .6rem;
            right: .6rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: .4rem;
            padding: .35rem;
            max-width: calc(100vw - 1.2rem);
            background: #101b28;
            border: 1px solid #344b5f;
            border-radius: .65rem;
            font-size: .85rem;
        }
        #platform-menu > a, #platform-menu summary {
            display: block;
            padding: .45rem .6rem;
            color: #d8eafa;
            cursor: pointer;
        }
        #platform-menu form {
            position: absolute;
            bottom: calc(100% + .5rem);
            right: 0;
            width: min(20rem, calc(100vw - 2.5rem));
            display: grid;
            gap: .6rem;
            padding: .8rem;
            color: #d8eafa;
            background: #101b28;
            border: 1px solid #344b5f;
            border-radius: .65rem;
        }
        #platform-menu input, #platform-menu audio { display: block; width: 100%; box-sizing: border-box; }
        #platform-menu input, #platform-menu button {
            margin-top: .25rem; padding: .45rem; color: #e9f4ff;
            background: #182b3d; border: 1px solid #43617a; border-radius: .4rem;
        }

        #loading-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .spinner {
            border: 4px solid rgba(0, 229, 255, 0.1);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border-left-color: #00e5ff;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <link rel="rust" data-trunk href="crates/hblite_desktop/Cargo.toml" data-target-name="hblite_desktop" data-wasm-opt="z" />
</head>
<body>
    <div id="loading-screen">
        <div class="spinner"></div>
        <div style="font-size: 1.1rem; font-weight: 600; color: #00e5ff; letter-spacing: 1px;">HEAVENLYBOUND LITE</div>
        <div style="font-size: 0.85rem; color: #8892b0; margin-top: 4px;">Mounting Lemuria V2 WebAssembly & WebGPU...</div>
    </div>
    <div id="canvas-container">
        <canvas id="the_canvas_id"></canvas>
    </div>
    <nav id="platform-menu" aria-label="Platform main menu">
        <a href="https://heavenlysent-680ac.web.app/">Launch HeavenlyBound</a>
        <details name="platform-tools">
        <summary>Radio</summary>
    <form id="station-radio">
      <label>Seven Daughters Radio <input id="station-url" type="url" placeholder="https://station.example/live.mp3" required></label>
      <button type="submit">Tune in</button>
      <audio id="station-audio" controls preload="none" aria-label="Seven Daughters live radio"></audio>
      <output id="station-status" aria-live="polite">Enter the live station URL.</output>
    </form>
        </details>
        <details name="platform-tools">
        <summary>Sonar</summary>
    <form id="sonar-connection">
        <label>Sonar endpoint <input name="endpoint" placeholder="wss://relay.example/ws/sonar" required></label>
        <label>Read-only token <input id="sonar-token" type="password" autocomplete="off"></label>
        <button type="submit" disabled>Connect</button>
        <output id="sonar-connection-state" aria-live="polite">Disconnected</output>
    </form>
        </details>
    </nav>
    <script src="station-radio.js" defer></script>
    <script src="sonar-client.js?v=signed-telemetry-1" defer></script>

    <script type="module">
        window.addEventListener("TrunkApplicationStarted", async (event) => {
            console.log("TrunkApplicationStarted event received. Initializing WebHandle...");
            try {
                const loadingScreen = document.getElementById("loading-screen");
                const canvas = document.getElementById("the_canvas_id");
                
                if (window.wasmBindings && window.wasmBindings.WebHandle) {
                    const handle = new window.wasmBindings.WebHandle();
                    console.log("Starting eframe WebRunner on canvas #the_canvas_id...");
                    await handle.start(canvas);
                    console.log("HeavenlyBound Lite UI successfully mounted.");
                    
                    if (loadingScreen) {
                        loadingScreen.style.opacity = "0";
                        setTimeout(() => loadingScreen.remove(), 400);
                    }
                } else {
                    console.error("WebHandle was not found in wasmBindings:", window.wasmBindings);
                }
            } catch (err) {
                console.error("Failed to start HeavenlyBound Lite WebRunner:", err);
                const loadingText = document.querySelector("#loading-screen div:last-child");
                if (loadingText) {
                    loadingText.innerText = "Error initializing WebGPU/WebGL: " + err;
                    loadingText.style.color = "#ff4d4f";
                }
            }
        });
    </script>
</body>
</html>

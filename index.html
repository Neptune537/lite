<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HeavenlyBound // Lemuria Pause Menu & Companion HUD</title>
    <meta name="description" content="Pure Rust WebGPU / WebGL2 Pause Menu, Coral Escrow, Siren Radio, and Planetary Geodesics">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0f19;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            width: 100%;
            height: 100%;
            outline: none;
        }

        #loading-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .spinner {
            border: 4px solid rgba(0, 229, 255, 0.1);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border-left-color: #00e5ff;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <link rel="rust" data-trunk href="crates/hblite_desktop/Cargo.toml" data-target-name="hblite_desktop" data-wasm-opt="z" />
</head>
<body>
    <div id="loading-screen">
        <div class="spinner"></div>
        <div style="font-size: 1.1rem; font-weight: 600; color: #00e5ff; letter-spacing: 1px;">HEAVENLYBOUND LITE</div>
        <div style="font-size: 0.85rem; color: #8892b0; margin-top: 4px;">Mounting Lemuria V2 WebAssembly & WebGPU...</div>
    </div>
    <div id="canvas-container">
        <canvas id="the_canvas_id"></canvas>
    </div>
</body>
</html>
